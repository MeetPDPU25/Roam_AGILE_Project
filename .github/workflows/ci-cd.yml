name: RoamRajasthan CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Install & Validate
  # ─────────────────────────────────────────────
  backend-ci:
    name: Backend - Install and Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install backend dependencies
        run: npm install

      - name: Verify server entry point exists
        run: test -f server.js && echo "server.js found"

  # ─────────────────────────────────────────────
  # JOB 2: Frontend — Install, Lint & Build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend - Install, Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade npm to v11
        run: npm install -g npm@11

      - name: Install frontend dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images
  # Runs only on push to main/master after CI passes
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print summary
        run: |
          echo "### Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-backend:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ secrets.DOCKERHUB_USERNAME }}/roamrajasthan-frontend:latest |" >> $GITHUB_STEP_SUMMARY
